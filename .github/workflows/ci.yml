name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/otelstarter

  # Validates the local stack's files with the real tools, so a config the
  # Collector or Compose would reject never ships.
  local-stack-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Collector config
        run: >
          docker run --rm
          -v "$PWD/internal/localstack/files/collector.yaml:/config.yaml:ro"
          otel/opentelemetry-collector:0.162.0
          validate --config=/config.yaml
      - name: Validate Compose file
        run: docker compose -f internal/localstack/files/compose.yaml config --quiet

  # The Python domain-event SDK, on the oldest and newest supported Pythons.
  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check the packaged LICENSE matches the repository's
        run: cmp LICENSE ../../LICENSE
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest

  # The Node.js SDK (sdk/node), on the Node.js releases still supported upstream.
  node-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check the packaged LICENSE matches the repository's
        run: cmp LICENSE ../../LICENSE
      - name: Install
        run: npm ci
      - name: Test
        run: npm test

  # Real apps (Express, NestJS, Flask, FastAPI, under gunicorn and uvicorn too)
  # must answer exactly the same with otelstarter as without it, stop cleanly,
  # and send telemetry without leaking secrets. See compat/README.md.
  compat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the apps with and without otelstarter
        run: python compat/run.py
        env:
          DATABASE_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
