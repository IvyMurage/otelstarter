name: Release CLI

# Pushing a tag like v0.1.0 tests the CLI, builds it for Linux, macOS and
# Windows, and publishes a GitHub release with the archives and checksums.
# SDK tags (sdk-node-v*, sdk-python-v*) do not match "v*".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest Go, for its security fixes; go.mod only sets the minimum.
          go-version: stable
      - name: Check the tag is a version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "Tag $GITHUB_REF_NAME is not a version such as v0.1.0"; exit 1; }
      - name: Test
        run: go test ./...
      - name: Build
        run: .github/scripts/build-cli.sh "$GITHUB_REF_NAME" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix, such as v0.2.0-rc.1, is marked as a pre-release.
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "otelstarter $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
