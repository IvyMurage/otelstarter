name: Question
description: Not sure how to do something, or whether it is a bug? Ask here.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        No question is too small. The [quickstart](https://github.com/IvyMurage/otelstarter/blob/main/docs/quickstart.md) and the [project guide](https://github.com/IvyMurage/otelstarter/blob/main/docs/PROJECT_GUIDE.md) may already have the answer.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `otelstarter doctor`, if it is about your setup
      description: It hides secrets, so it is safe to paste.
      render: text
