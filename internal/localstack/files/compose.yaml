# Local observability stack started by `otelstarter run`.
# Generated by otelstarter: edits are overwritten.
#
# Ports are bound to 127.0.0.1 only: Grafana here has no login, so it must
# not be reachable from other machines on the network.
name: otelstarter

services:
  collector:
    image: otel/opentelemetry-collector:0.162.0
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:4317:4317   # OTLP over gRPC
      - 127.0.0.1:4318:4318   # OTLP over HTTP
      - 127.0.0.1:13133:13133 # health check
    depends_on:
      - backend

  # Grafana with Tempo (traces), Loki (logs) and Prometheus (metrics).
  backend:
    image: grafana/otel-lgtm:0.35.0
    ports:
      - 127.0.0.1:3000:3000   # Grafana
