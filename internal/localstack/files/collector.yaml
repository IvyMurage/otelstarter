# OpenTelemetry Collector for the local stack started by `otelstarter run`.
# Applications send OTLP here; the Collector cleans up the data and forwards
# it to the backend. Generated by otelstarter: edits are overwritten.

extensions:
  # Lets otelstarter check that the Collector is ready.
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Refuse data instead of running out of memory under a traffic spike.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Spans that add volume, not insight. FastAPI/Starlette instrumentation
  # adds an internal span for every ASGI send and receive event.
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'kind == SPAN_KIND_INTERNAL and attributes["asgi.event.type"] != nil'
        # Express adds a span for its two built-in middleware on every
        # request. Your own middleware (auth, validation) is kept.
        - 'attributes["express.type"] == "middleware" and (attributes["express.name"] == "query" or attributes["express.name"] == "expressInit")'

  batch: {}

exporters:
  otlp_http/backend:
    endpoint: http://backend:4318

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/noise, batch]
      exporters: [otlp_http/backend]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/backend]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/backend]
