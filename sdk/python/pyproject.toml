[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "otelstarter"
dynamic = ["version"] # read from src/otelstarter/__init__.py, the single source
description = "Lightweight OpenTelemetry helpers for Python: structured JSON logs, redaction, query sanitising and business events."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "opentelemetry",
    "otel",
    "observability",
    "tracing",
    "metrics",
    "logging",
    "instrumentation",
    "flask",
    "fastapi",
    "django",
    "redaction",
    "apm",
    "monitoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Only the API: an app without OpenTelemetry configured gets a no-op, and the
# app chooses the SDK version. 1.45.0 is the version otelstarter tests with.
dependencies = ["opentelemetry-api>=1.45.0"]

[project.optional-dependencies]
dev = [
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation==0.66b0",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Found by opentelemetry-instrument and the SDK's configuration: setting
# OTEL_TRACES_EXPORTER / OTEL_LOGS_EXPORTER to "otelstarter" selects the
# cleaning exporters, and the instrumentor switches on JSON logs.
[project.entry-points.opentelemetry_traces_exporter]
otelstarter = "otelstarter.exporters:PrivacySpanExporter"

[project.entry-points.opentelemetry_logs_exporter]
otelstarter = "otelstarter.exporters:PrivacyLogExporter"

[project.entry-points.opentelemetry_instrumentor]
otelstarter = "otelstarter.instrumentor:OtelStarterInstrumentor"

[project.urls]
Homepage = "https://github.com/IvyMurage/otelstarter"
Documentation = "https://github.com/IvyMurage/otelstarter/tree/main/docs"
Changelog = "https://github.com/IvyMurage/otelstarter/blob/main/CHANGELOG.md"
Issues = "https://github.com/IvyMurage/otelstarter/issues"
Source = "https://github.com/IvyMurage/otelstarter/tree/main/sdk/python"

[tool.hatch.version]
path = "src/otelstarter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/otelstarter"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]  # unexpected warnings fail the tests
